<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - VolunteerConnect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page-container" style="max-width: 480px; margin: 8rem auto; padding: 2rem;">
    <h1 class="font-display text-2xl font-black mb-4">Set a new password</h1>
    <p id="resetMessage" class="text-muted mb-6">Choose a new password for your account. This link can only be used once and only the newest link is valid.</p>
    <form id="resetForm">
      <label class="form-label" for="password">New password</label>
      <input class="input-field mb-4" id="password" type="password" minlength="8" required>
      <label class="form-label" for="confirmPassword">Confirm password</label>
      <input class="input-field mb-6" id="confirmPassword" type="password" minlength="8" required>
      <button class="btn btn-primary w-full" type="submit">Reset password</button>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const form = document.getElementById('resetForm');
    const message = document.getElementById('resetMessage');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        message.textContent = 'Passwords do not match.';
        return;
      }

      try {
        const response = await fetch('../backend/auth/reset-password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            email: params.get('email') || '',
            token: params.get('token') || '',
            password,
            confirm_password: confirmPassword
          })
        });
        const data = await response.json();
        message.textContent = data.message || 'Request completed.';
        if (data.success) {
          form.reset();
          setTimeout(() => { window.location.href = '../index.html'; }, 1500);
        } else if (response.status === 400) {
          message.textContent = 'This link is invalid, expired, or was replaced by a newer request. Return to the login page and request a new link.';
        }
      } catch (error) {
        message.textContent = 'Could not reach the server. Make sure Apache and MySQL are running, then try again.';
      }
    });
  </script>
</body>
</html>
